name: Zentao Samples CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node deps
        working-directory: docs/zentao_sample
        run: |
          if [ -f package.json ]; then npm install --no-progress --no-audit; fi

      - name: Node smoke test
        working-directory: docs/zentao_sample
        run: |
          node -e "require('./zentao_node_connector.js'); console.log('node ok')"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python deps
        run: |
          if [ -f docs/zentao_sample/zentao_python_requirements.txt ]; then python -m pip install -r docs/zentao_sample/zentao_python_requirements.txt --upgrade pip; fi

      - name: Python smoke test
        working-directory: docs/zentao_sample
        run: |
          python -c "import importlib.util, sys; spec=importlib.util.spec_from_file_location('zentao','zentao_python_connector.py'); mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod); print('python ok')"
