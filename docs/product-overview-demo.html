<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>产品总览 · PM Assistant</title>
<style>
/* ═══════════════════════════════════════════ tokens ═══════════════════════════════════════ */
:root {
  --bg:          #F4F6FB;
  --surface:     #FFFFFF;
  --surface2:    #F8FAFD;
  --fg:          #17191F;
  --muted:       #6B7694;
  --border:      #E3E8F4;
  --accent:      #2D6FEC;
  --accent-h:    #2260D8;
  --accent-lt:   #EDF2FE;
  --success:     #15803D;
  --success-lt:  #DCFCE7;
  --warn:        #B45309;
  --warn-lt:     #FEF3C7;
  --danger:      #DC2626;
  --danger-lt:   #FEE2E2;
  --fav:         #7C3AED;
  --fav-lt:      #F3EEFF;
  --sidebar-w:   228px;
  --header-h:    54px;
  --font:        'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --mono:        'JetBrains Mono', ui-monospace, Menlo, monospace;
  --r:           8px;
  --r-lg:        12px;
  --sh:          0 1px 3px rgba(16,24,48,0.06), 0 1px 2px rgba(16,24,48,0.04);
  --sh-md:       0 4px 14px rgba(16,24,48,0.09);
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; }

/* ═══════════════════════════════════════════ sidebar (shared) ═════════════════════════════ */
.sidebar {
  width: var(--sidebar-w); height: 100vh; background: var(--surface);
  border-right: 1px solid var(--border); display: flex; flex-direction: column;
  position: fixed; top: 0; left: 0; z-index: 200;
}
.sidebar-brand {
  padding: 14px 16px; display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--border); cursor: pointer; user-select: none;
  transition: background 0.12s;
}
.sidebar-brand:hover { background: var(--bg); }
.sidebar-brand svg { width: 24px; height: 24px; flex-shrink: 0; }
.brand-text { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
.brand-sub  { font-size: 10px; color: var(--muted); font-weight: 400; }

.sidebar-nav { padding: 8px 8px; flex: 1; overflow-y: auto; }
.nav-group { margin-bottom: 6px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.nav-group:last-child { border-bottom: none; }
.nav-group-label {
  font-size: 10.5px; font-weight: 650; color: var(--muted);
  letter-spacing: 0.05em; text-transform: uppercase; padding: 6px 10px 4px;
}
.nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; border-radius: 7px; cursor: pointer;
  color: var(--muted); font-size: 13px; font-weight: 450;
  transition: background 0.12s, color 0.12s; user-select: none;
  position: relative;
}
.nav-item:hover { background: var(--bg); color: var(--fg); }
.nav-item.active { background: var(--accent-lt); color: var(--accent); font-weight: 540; }
.nav-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--border);
  flex-shrink: 0; transition: background 0.15s;
}
.nav-item.active .nav-dot { background: var(--accent); }
.nav-item:hover .nav-dot { background: var(--muted); }
.nav-badge {
  margin-left: auto; background: var(--danger); color: #fff;
  font-size: 10px; font-weight: 600; padding: 0 5px; height: 16px;
  line-height: 16px; border-radius: 8px; min-width: 16px; text-align: center;
}
.sidebar-footer {
  padding: 8px; border-top: 1px solid var(--border); flex-shrink: 0;
}
.theme-row {
  display: flex; align-items: center; gap: 8px; padding: 6px 8px;
  border-radius: 7px; cursor: pointer; color: var(--muted);
  font-size: 12px; transition: background 0.12s; user-select: none;
}
.theme-row:hover { background: var(--bg); color: var(--fg); }
.theme-row svg { width: 15px; height: 15px; flex-shrink: 0; }

/* ═══════════════════════════════════════════ topbar ═══════════════════════════════════════ */
.main { margin-left: var(--sidebar-w); min-height: 100vh; display: flex; flex-direction: column; }
.topbar {
  height: var(--header-h); background: var(--surface);
  border-bottom: 1px solid var(--border); display: flex; align-items: center;
  padding: 0 24px; gap: 12px; position: sticky; top: 0; z-index: 100;
}
.topbar-breadcrumb { display: flex; align-items: center; gap: 6px; }
.topbar-breadcrumb span { font-size: 12px; color: var(--muted); }
.topbar-breadcrumb .current { color: var(--fg); font-weight: 600; font-size: 14px; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.avatar {
  width: 30px; height: 30px; border-radius: 50%; background: var(--accent);
  color: #fff; font-size: 11px; font-weight: 600;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.content { padding: 24px 28px 40px; flex: 1; min-width: 0; }
.content-sticky { position: sticky; top: var(--header-h); z-index: 99; background: var(--bg); padding-bottom: 8px; }

/* ═══════════════════════════════════════════ page header ═════════════════════════════════ */
.page-hd { margin-bottom: 20px; display: flex; align-items: flex-start; justify-content: space-between; }
.page-hd h1 { font-size: 22px; font-weight: 650; margin: 0 0 2px; letter-spacing: -0.015em; }
.page-hd .sub { font-size: 13px; color: var(--muted); }

/* ═══════════════════════════════════════════ search bar ═════════════════════════════════ */
.search-bar {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
  margin-bottom: 18px; transition: border-color 0.15s, box-shadow 0.15s;
}
.search-bar:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-lt); }
.search-bar svg { width: 16px; height: 16px; color: var(--muted); flex-shrink: 0; }
.search-bar input {
  flex: 1; border: 0; outline: 0; background: transparent;
  font: inherit; font-size: 14px; color: var(--fg);
}
.search-bar input::placeholder { color: var(--muted); }
.search-bar kbd {
  font-family: var(--mono); font-size: 10px; padding: 2px 6px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 4px; color: var(--muted);
}
.search-result-count { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
.search-result-count strong { color: var(--fg); }

/* ═══════════════════════════════════════════ L1 category cards ═════════════════════════════ */
.cat-grid {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px;
  margin-bottom: 20px;
}
.cat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 18px 20px; cursor: pointer;
  transition: box-shadow 0.15s, border-color 0.15s, transform 0.1s;
  display: flex; align-items: center; gap: 14px; position: relative; overflow: hidden;
}
.cat-card:hover { box-shadow: var(--sh-md); transform: translateY(-1px); }
.cat-card.active { border-color: var(--accent); background: var(--accent-lt); }
.cat-card::before {
  content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 3px;
}
.cat-card.l1-self::before  { background: var(--accent); }
.cat-card.l1-integ::before { background: var(--success); }
.cat-card.l1-purch::before { background: var(--warn); }
.cat-card.l1-inner::before { background: var(--danger); }
.cat-card.l1-fav::before   { background: var(--fav); }
.cat-icon {
  width: 40px; height: 40px; border-radius: 10px; display: flex;
  align-items: center; justify-content: center; flex-shrink: 0;
  font-size: 18px;
}
.cat-icon.self  { background: var(--accent-lt); color: var(--accent); }
.cat-icon.integ { background: var(--success-lt); color: var(--success); }
.cat-icon.purch { background: var(--warn-lt); color: var(--warn); }
.cat-icon.inner { background: var(--danger-lt); color: var(--danger); }
.cat-icon.fav   { background: var(--fav-lt);   color: var(--fav); }
.cat-info { flex: 1; min-width: 0; }
.cat-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
.cat-desc { font-size: 11px; color: var(--muted); }
.cat-count {
  font-family: var(--mono); font-size: 24px; font-weight: 700;
  letter-spacing: -0.02em; flex-shrink: 0;
}

/* ═══════════════════════════════════════════ L2 subcategory chips ═════════════════════════ */
.l2-bar {
  display: flex; align-items: center; gap: 8px; margin-bottom: 18px;
  flex-wrap: wrap; padding: 10px 0;
}
.l2-label { font-size: 12px; color: var(--muted); font-weight: 550; flex-shrink: 0; }
.l2-chip {
  padding: 5px 14px; border-radius: 16px; border: 1px solid var(--border);
  background: var(--surface); color: var(--muted); font-size: 12px; font-weight: 500;
  cursor: pointer; transition: background 0.12s, color 0.12s, border-color 0.12s;
  white-space: nowrap;
}
.l2-chip:hover { border-color: var(--accent); color: var(--fg); }
.l2-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.l2-count { font-size: 10px; opacity: 0.7; margin-left: 3px; }

/* ═══════════════════════════════════════════ product grid ═════════════════════════════════ */
.prod-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px;
}
.prod-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 18px; cursor: pointer;
  transition: box-shadow 0.15s, border-color 0.15s, transform 0.1s;
  display: flex; flex-direction: column; gap: 10px;
}
.prod-card:hover { box-shadow: var(--sh-md); border-color: var(--accent); transform: translateY(-1px); }
.prod-card-header { display: flex; justify-content: space-between; align-items: flex-start; }
.prod-code {
  font-family: var(--mono); font-size: 14px; font-weight: 650; color: var(--accent);
  letter-spacing: -0.01em;
}
.prod-name { font-size: 13px; color: var(--fg); font-weight: 500; margin-top: 2px; }
.prod-desc { font-size: 12px; color: var(--muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.prod-tags { display: flex; gap: 4px; flex-wrap: wrap; }
.prod-tag {
  padding: 2px 8px; border-radius: 4px; font-size: 10.5px; font-weight: 500;
  border: 1px solid var(--border); background: var(--bg); color: var(--muted);
  white-space: nowrap;
}
.prod-tag.t0 { border-color: var(--accent); color: var(--accent); background: var(--accent-lt); }
.prod-tag.t1 { border-color: var(--success); color: var(--success); background: var(--success-lt); }
.prod-tag.t2 { border-color: var(--warn); color: var(--warn); background: var(--warn-lt); }
.prod-footer {
  display: flex; justify-content: space-between; align-items: center;
  padding-top: 8px; border-top: 1px solid var(--border);
}
.prod-src {
  font-size: 10.5px; padding: 2px 8px; border-radius: 10px; font-weight: 500;
}
.prod-src.local  { background: var(--warn-lt); color: var(--warn); }
.prod-src.synced { background: var(--accent-lt); color: var(--accent); }
.prod-status {
  font-size: 11px; font-weight: 550; display: flex; align-items: center; gap: 4px;
}
.prod-status-dot { width: 6px; height: 6px; border-radius: 50%; }
.prod-status-dot.prod   { background: var(--success); }
.prod-status-dot.trial  { background: var(--accent); }
.prod-status-dot.dev    { background: var(--warn); }
.prod-status-dot.eol    { background: var(--muted); }

/* ═══════════════════════════════════════════ empty state ═════════════════════════════════ */
.empty-state {
  text-align: center; padding: 48px 24px; color: var(--muted);
}
.empty-state svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.3; }
.empty-state p { font-size: 14px; }

/* dark mode */
[data-theme="dark"] {
  --bg: #0B0E14; --surface: #141820; --surface2: #1A1F2C;
  --fg: #E4E9F6; --muted: #717DA0; --border: #232839;
  --accent: #4D86F7; --accent-h: #5E93FF; --accent-lt: #151E35;
  --success: #34D399; --success-lt: #0A2218;
  --warn: #FBBF24; --warn-lt: #201800;
  --danger: #F87171; --danger-lt: #1E0808;
  --fav: #A78BFA; --fav-lt: #1C1535;
}
</style>
</head>

/* ═══════════════════════════════════════════ state ═══════════════════════════════════════ */
let activeL1 = 'fav';
let activeL2 = null;  // null = all L2s within activeL1
let searchQuery = '';

/* ═══════════════════════════════════════════ render L1 cards ═════════════════════════════ */
function renderL1Cards() {
  const grid = document.getElementById('catGrid');
  grid.innerHTML = L1_CATEGORIES.map(c => `
    <div class="cat-card l1-${c.cls}${activeL1 === c.id ? ' active' : ''}" onclick="selectL1('${c.id}')">
      <div class="cat-icon ${c.cls}">${c.icon}</div>
      <div class="cat-info">
        <div class="cat-name">${c.name}</div>
        <div class="cat-desc">${c.desc}</div>
      </div>
      <div class="cat-count" style="color:${c.accent}">${c.count}</div>
    </div>
  `).join('');
}

/* ═══════════════════════════════════════════ render L2 chips ═════════════════════════════ */
function renderL2Chips() {
  const cat = L1_CATEGORIES.find(c => c.id === activeL1);
  if (!cat || cat.l2.length === 0) { document.getElementById('l2Bar').innerHTML = ''; return; }
  const bar = document.getElementById('l2Bar');
  const allActive = activeL2 === null;
  bar.innerHTML = `<span class="l2-label">子类：</span>
    <span class="l2-chip${allActive ? ' active' : ''}" onclick="selectL2(null)">全部<span class="l2-count">${cat.count}</span></span>
    ${cat.l2.map(l => {
      const active = activeL2 === l.name;
      return `<span class="l2-chip${active ? ' active' : ''}" onclick="selectL2('${l.name}')">${l.name}<span class="l2-count">${l.count}</span></span>`;
    }).join('')}`;
}

/* ═══════════════════════════════════════════ render products ═════════════════════════════ */
function renderProducts() {
  let filtered;
  if (activeL1 === 'fav') {
    filtered = PRODUCTS.filter(p => p.fav);
  } else {
    filtered = PRODUCTS.filter(p => p.l1 === activeL1);
  }
  if (activeL2) filtered = filtered.filter(p => p.l2 === activeL2);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(p =>
      p.code.toLowerCase().includes(q) ||
      p.name.toLowerCase().includes(q) ||
      p.tags.some(t => t.toLowerCase().includes(q))
    );
  }

  const grid = document.getElementById('prodGrid');
  const empty = document.getElementById('emptyState');
  const count = document.getElementById('resultCount');

  if (searchQuery) {
    count.innerHTML = `找到 <strong>${filtered.length}</strong> 个匹配产品`;
    count.style.display = '';
  } else {
    count.style.display = 'none';
  }

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  const statusLabel = { prod:'量产', trial:'试产', dev:'研发中', eol:'已停产' };
  grid.innerHTML = filtered.map((p, i) => `
    <div class="prod-card" onclick="openDetail('${p.code}')">
      <div class="prod-card-header">
        <div>
          <div class="prod-code">${p.code}</div>
          <div class="prod-name">${p.name}</div>
        </div>
        <span class="prod-status">
          <span class="prod-status-dot ${p.status}"></span>${statusLabel[p.status]}
        </span>
      </div>
      <div class="prod-desc">${p.desc}</div>
      <div class="prod-tags">${p.tags.map((t,j) => `<span class="prod-tag t${j%5}">${t}</span>`).join('')}</div>
      <div class="prod-footer">
        <span class="prod-src ${p.src}">${p.src === 'local' ? 'PMA 本地' : '禅道同步'}</span>
        <span style="font-size:11px;color:var(--muted);">${L1_CATEGORIES.find(c=>c.id===p.l1).name} · ${p.l2}</span>
      </div>
    </div>
  `).join('');
}

/* ═══════════════════════════════════════════ actions ═════════════════════════════════════ */
function selectL1(id) {
  activeL1 = id;
  activeL2 = null;
  renderL1Cards();
  renderL2Chips();
  renderProducts();
}

function selectL2(name) {
  activeL2 = name;
  renderL2Chips();
  renderProducts();
}

function doSearch() {
  searchQuery = document.getElementById('searchInput').value.trim();
  renderProducts();
}

function openDetail(code) {
  alert('打开产品详情：' + code + '\n（实际应用中导航到产品详情页）');
}

function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('theme-label').textContent = isDark ? '暗色模式' : '亮色模式';
}

/* ═══════════════════════════════════════════ init ═══════════════════════════════════════ */
renderL1Cards();
renderL2Chips();
renderProducts();
</script>
