services:
  backend:
    build: .
    container_name: pma-backend
    ports:
      - "8080:8000"
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    environment:
      - DATABASE_URL=sqlite:///./data/pma.db
      - ZENTAO_BASE_URL=${ZENTAO_BASE_URL:-}
      - ZENTAO_AUTH_ACCOUNT=${ZENTAO_AUTH_ACCOUNT:-}
      - ZENTAO_AUTH_PASSWORD=${ZENTAO_AUTH_PASSWORD:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - TZ=Asia/Shanghai
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SYNC_INTERVAL_MINUTES=${SYNC_INTERVAL_MINUTES:-60}
      - SQLCIPHER_KEY_FILE=/run/secrets/sqlcipher_key
    secrets:
      - sqlcipher_key
    restart: unless-stopped
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

secrets:
  sqlcipher_key:
    file: ./secrets/sqlcipher_key.txt
