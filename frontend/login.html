<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="app-version" content="v2026.09.03-beta7">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>PMA · 登录</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--fg);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  -webkit-font-smoothing: antialiased;
}
.login-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-md);
  padding: 40px;
  width: 100%;
  max-width: 400px;
}
.login-logo {
  text-align: center; margin-bottom: 24px;
}
.login-logo-img {
  display: block; margin: 0 auto 8px;
}
.login-logo-dark { display: none; }
[data-theme="dark"] .login-logo-light { display: none; }
[data-theme="dark"] .login-logo-dark { display: block; }
.login-logo p { font-size: 12px; color: var(--muted); margin-top: 4px; }
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block; font-size: 12px; font-weight: 600;
  color: var(--muted); margin-bottom: 6px;
  text-transform: uppercase; letter-spacing: 0.05em;
}
.form-group input {
  width: 100%; padding: 10px 14px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); color: var(--fg);
  font-family: var(--font); font-size: 14px;
  outline: none; transition: border-color 0.12s;
}
.form-group input:focus { border-color: var(--accent); }
.login-btn {
  width: 100%; padding: 11px;
  border-radius: 8px; border: none;
  background: var(--accent); color: #fff;
  font-family: var(--font); font-size: 14px; font-weight: 600;
  cursor: pointer; transition: background 0.12s;
  margin-top: 8px;
}
.login-btn:hover { background: var(--accent-h); }
.login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
/* GitLab OAuth button */
.login-btn-gitlab {
  background: #6b4fbb; display: flex; align-items: center; justify-content: center; gap: 6px;
}
.login-btn-gitlab:hover { background: #5a3fa8; }
/* OAuth divider */
.oauth-divider {
  display: flex; align-items: center; margin: 16px 0; color: var(--muted); font-size: 12px;
}
.oauth-divider::before, .oauth-divider::after {
  content: ''; flex: 1; border-top: 1px solid var(--border);
}
.oauth-divider span { padding: 0 12px; }
/* Admin login link */
.admin-login-link {
  display: block; text-align: center; font-size: 12px; color: var(--muted);
  text-decoration: none; cursor: pointer; margin-top: 8px;
}
.admin-login-link:hover { color: var(--accent); }
.login-error {
  color: var(--danger); font-size: 12.5px;
  text-align: center; margin-top: 12px; min-height: 18px;
}
</style>
</head>
<body>

<div id="shutdown-banner" style="display:none;position:fixed;top:0;left:0;right:0;z-index:99999;background:var(--danger);color:#fff;text-align:center;padding:10px 20px;font-size:13px;font-weight:600;animation:sh-blink 1s infinite alternate">
  <span id="shutdown-banner-msg">服务器即将重启，请保存工作。重启后需重新登录。</span>
</div>
<style>@keyframes sh-blink{from{opacity:1}to{opacity:0.6}}</style>
<div class="login-card">
  <div class="login-logo">
    <img src="/logo/logo-mark-light.svg" alt="PMAssistant" class="login-logo-img login-logo-light" width="160" height="140">
    <img src="/logo/logo-mark-dark.svg" alt="PMAssistant" class="login-logo-img login-logo-dark" width="160" height="140">
    <p>项目管理助手 · 集成禅道 &amp; GitLab</p>
  </div>
  <!-- GitLab OAuth login (primary, shown by default when OAuth is enabled) -->
  <div id="gitlab-login-section" style="display:none">
    <button type="button" class="login-btn login-btn-gitlab" id="gitlab-login-btn" onclick="loginWithGitlab()">
      <svg width="20" height="20" viewBox="0 0 380 380" fill="currentColor" style="vertical-align:-4px;margin-right:6px"><path d="M282.83 170.73l-.27-.69-26.14-68.22a6.81 6.81 0 00-2.69-3.24 7 7 0 00-8 .43 7 7 0 00-2.32 3.52l-17.65 54H154.07l-17.65-54a6.86 6.86 0 00-2.32-3.53 7 7 0 00-8-.43 6.87 6.87 0 00-2.69 3.24L97.44 170l-.26.69a48.54 48.54 0 0016.1 56.1l.09.07.24.17 39.82 30.2 19.7 15.11 12 9.08a7.07 7.07 0 004.33 1.58 7.09 7.09 0 004.33-1.58l12-9.08 19.7-15.11 40.06-30.35.09-.07a48.63 48.63 0 0016.08-56.1z"/></svg>
      使用 GitLab 登录
    </button>
    <div class="login-error" id="login-error"></div>
    <div class="oauth-divider">
      <span>或</span>
    </div>
    <a href="javascript:void(0)" class="admin-login-link" id="admin-login-toggle" onclick="toggleAdminLogin()">管理员登录</a>
  </div>
  <!-- Local password login (secondary, initially hidden when OAuth is enabled) -->
  <div id="local-login-section" style="display:none">
    <form onsubmit="onLogin(event)">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="login-username" placeholder="请输入用户名" autocomplete="username">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="login-password" placeholder="请输入密码" autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn" id="login-btn">登录</button>
      <div class="login-error" id="local-login-error"></div>
    </form>
    <a href="javascript:void(0)" class="admin-login-link" onclick="toggleAdminLogin()" style="margin-top:12px">← 返回 GitLab 登录</a>
  </div>
</div>

<script>
// Detect system theme preference and apply as default
(function() {
  var mode = localStorage.getItem('pm_theme_mode') || localStorage.getItem('pm_theme');
  if (!mode || (mode !== 'light' && mode !== 'dark' && mode !== 'auto')) {
    mode = 'auto';
    localStorage.setItem('pm_theme_mode', 'auto');
  }
  if (mode !== 'auto') localStorage.setItem('pm_theme_mode', mode);
  var theme = mode === 'auto'
    ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    : mode;
  localStorage.setItem('pm_theme', theme);
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
<script>
window.APP_VERSION = document.querySelector('meta[name="app-version"]').content;
(function(){
var v = window.APP_VERSION;
document.write('<link rel="stylesheet" href="/css/tokens.css?v=' + v + '">');
document.write('<link rel="stylesheet" href="/css/density.css?v=' + v + '">');
document.write('<script src="/js/utils.js?v=' + v + '"><\/script>');
document.write('<script src="/js/api.js?v=' + v + '"><\/script>');
document.write('<script src="/js/auth.js?v=' + v + '"><\/script>');
})();
</script>
</body>
</html>
